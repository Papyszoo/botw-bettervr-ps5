# SPDX-License-Identifier: GPL-3.0-or-later
# BotW-BetterVR on PS5: publishes a console test build as a pre-release (docs/bettervr-ps5/PLAN.md).
# The build is made in a remote session, which can push but can neither create releases nor start a
# workflow by hand. The session pushes the build to a branch named staging/<tag>:
#   release.env  TAG=<tag>, TARGET=<the full commit ID the build came from>, TITLE=<release title>
#   notes.md     the release notes
#   SHA256SUMS   the files to attach, each split into parts under 95 MB (name.part-00, ...)
# This workflow joins the parts, checks every file against SHA256SUMS, creates the pre-release on
# TARGET, and deletes the staging branch. Test builds use TAG=testing, one rolling pre-release: an
# existing one is deleted with its tag first. A pre-release tag with a digit is refused, because
# ProsperoStore's update bot ships every release whose tag has a digit to store users.
name: BetterVR pre-release

on:
  push:
    branches: ['staging/**']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: staging
      - name: Join and check the files
        working-directory: staging
        run: |
          set -euo pipefail
          for first in *.part-00; do
            name=${first%.part-00}
            cat "$name".part-* > "$name"
            rm "$name".part-*
          done
          sha256sum -c SHA256SUMS
          ls -la
      - name: Create the pre-release
        working-directory: staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(sed -n 's/^TAG=//p' release.env)
          TARGET=$(sed -n 's/^TARGET=//p' release.env)
          TITLE=$(sed -n 's/^TITLE=//p' release.env)
          [[ "$GITHUB_REF_NAME" == "staging/$TAG" && "$TARGET" =~ ^[0-9a-f]{40}$ ]] || { echo "release.env does not match the branch"; exit 1; }
          if [[ "$TAG" =~ [0-9] ]]; then echo "A pre-release tag must not contain a digit (the store bot would ship it): use TAG=testing"; exit 1; fi
          files=$(awk '{print $2}' SHA256SUMS)
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$TARGET" \
            --title "$TITLE" --notes-file notes.md $files SHA256SUMS
      - name: Delete the staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"
