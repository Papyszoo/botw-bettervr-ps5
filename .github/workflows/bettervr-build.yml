# SPDX-License-Identifier: GPL-3.0-or-later
# BotW VR: builds this branch on a standard GitHub-hosted runner (2 vCPU, 7 GB), with
# docs/BUILDING.md's packages and `make release`. It only builds: no release, tag or branch is made,
# and no secret is used beyond the default token's read access. The push trigger is this branch
# alone (and the bettervr-1.0 and bettervr-1.0.2 stage branches); workflow_dispatch starts working once this file is on the default branch.
name: BetterVR build

on:
  push:
    branches: ['fix/vr-first-frame-sigill', 'bettervr-1.0/**', 'bettervr-1.0.2/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      # two compile jobs for two cores; the swap below takes the long Cemu link's peak
      JOBS: 2
      # Ubuntu 24.04's Python is externally managed: meson, mako and packaging go to the user site
      PIP_BREAK_SYSTEM_PACKAGES: 1
      # the compiler cache: CMake (Cemu, BetterVR, the libraries) reads the launcher from the
      # environment into a new build folder; meson (RADV) finds ccache on PATH by itself; the
      # boilerplate's own ninja steps ask for it with USE_CCACHE (the log said "disabled")
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      USE_CCACHE: 1
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: 1
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - name: Free disk
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /opt/microsoft /opt/az
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 llvm-18-dev libclang-18-dev libclc-18-dev \
            libllvmspirvlib-18-dev llvm-spirv-18 spirv-tools glslang-tools bison flex rsync \
            cmake ninja-build ccache git make python3 python3-pip wget unzip

      - name: meson, mako and packaging
        run: |
          python3 -m pip install --user meson mako packaging
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # the pinned inputs and the RADV/SDK build trees would otherwise be fetched and built again
      # after a failure: kept under the deps.json revision, and not restored across a change of pin
      - name: Cache the fetched inputs
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .deps
            ~/.cache/ps5cemu-deps
          key: bettervr-deps-${{ hashFiles('tools/deps.json') }}
          # a cache from before a pin changed still holds the RADV and SDK builds; the step below
          # takes the stale checkouts out of it
          restore-keys: |
            bettervr-deps-

      # a new key for every run, the last run's cache as the start: a cache is never changed once saved
      - name: Cache the compiler results
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.ccache
          key: bettervr-ccache-${{ hashFiles('tools/deps.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bettervr-ccache-${{ hashFiles('tools/deps.json') }}-
            bettervr-ccache-

      # a cached .deps keeps the ps5 branch of the last run's patches: start it from the pin again, so
      # a changed patch in patches/bettervr is applied (tools/bettervr-patches.sh refuses a branch that differs)
      - name: Patches from the pin
        shell: bash
        run: |
          if [ -d .deps/BotW-BetterVR/.git ]; then
            pin=$(python3 -c 'import json,sys; print(next(i["commit"] for i in json.load(open(sys.argv[1]))["items"] if i["name"] == "bettervr"))' tools/deps.json)
            if git -C .deps/BotW-BetterVR cat-file -e "$pin^{commit}"; then
              git -C .deps/BotW-BetterVR checkout -q -f -B ps5 "$pin"
            else
              rm -rf .deps/BotW-BetterVR # a cache from before the pin changed: fetched again by `make deps`
            fi
          fi

      # a cached .deps may hold Cemu from another repository or pin (upstream's, before the BetterVR
      # fork): such a checkout is removed and fetched again by `make deps`; the fork's, at the pin, goes
      # back to the pin so that the patches are applied again (tools/cemu-patches.sh refuses a branch that differs)
      - name: Cemu from the pin
        shell: bash
        run: |
          if [ -d .deps/Cemu/.git ]; then
            field() { python3 -c 'import json,sys; print(next(i[sys.argv[2]] for i in json.load(open(sys.argv[1]))["items"] if i["name"] == "cemu"))' tools/deps.json "$1"; }
            pin=$(field commit)
            if [ "$(git -C .deps/Cemu remote get-url origin)" = "$(field url)" ] && git -C .deps/Cemu cat-file -e "$pin^{commit}"; then
              git -C .deps/Cemu checkout -q -f -B ps5 "$pin"
            else
              rm -rf .deps/Cemu
            fi
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ccache --zero-stats
          make release 2>&1 | tee build.log

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Keep the compiler results
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: bettervr-ccache-${{ hashFiles('tools/deps.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the fetched inputs
        if: always() && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .deps
            ~/.cache/ps5cemu-deps
          key: bettervr-deps-${{ hashFiles('tools/deps.json') }}

      - name: The build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bettervr-build
          path: |
            dist/BotW-VR-v*.zip
            dist/ps5cemu-v*.elf
          if-no-files-found: error
          retention-days: 3

      - name: Build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bettervr-build-logs
          path: |
            build.log
            build/**/*.log
          if-no-files-found: ignore
          retention-days: 3
