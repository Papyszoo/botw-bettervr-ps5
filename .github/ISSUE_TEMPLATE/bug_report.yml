name: Bug report
description: BotW VR crashes, freezes, won't install the game, or looks or plays wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Nearly every problem needs the logs, so please attach them (see the
        Logs box). Make them **right after the problem**, before starting the app again.

  - type: input
    id: app-version
    attributes:
      label: BotW VR version
      description: Settings > About shows it ("Version ...").
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: PS5 firmware
      description: From System Settings > System > System Software. HEN payloads can make logs show a different, spoofed version, so go by the Settings screen.
      placeholder: "13.42"
    validations:
      required: true

  - type: input
    id: hen
    attributes:
      label: HEN and payloads
      description: Which HEN you loaded (etaHEN, OnionHEN, ...), its version, whether PPSA98720 is in its app jailbreak list, and any other payloads running.
      placeholder: "etaHEN 2.x, PPSA98720 in the app jailbreak list, ShadowMount Plus"
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Game region, update and DLC
      description: Region (USA, EUR, JPN), update version (v208 is the last), DLC version if installed, and the format of your dump (loadiine folder, WUA, WUX, ...).
      placeholder: "EUR, update v208, DLC v80, loadiine folder"
    validations:
      required: true

  - type: input
    id: headset
    attributes:
      label: Headset and controllers
      placeholder: "PS VR2 with Sense controllers"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: VR or TV mode
      options:
        - VR (headset on)
        - TV (no headset)
        - Both
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. For a crash or freeze, say where in the game or the app it happens.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: Steps that bring the problem back, and whether it happens every time.
      placeholder: |
        1. Start the game in VR
        2. Open the pause menu
        3. The picture freezes

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        In the app, Settings > Diagnostics > **Copy logs to USB** writes a `BotW-VR-logs-<date>` folder to a USB drive.
        Zip that folder (or the `/data/botwvr/launcher/logs` folder over FTP) and drag the zip in here.
        If you cannot start the app, say so and send what you can.
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Changes to bettervr.json
      description: Paste the contents of `/data/botwvr/launcher/bettervr.json` if you edited it (or say it is untouched). Also list other changes, such as graphic packs.
